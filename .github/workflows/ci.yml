name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MIX_ENV: test
  # Pin the toolchain. setup-beam fully supports OTP 28 with reliable
  # precompiled artifacts. We use the newest stable Elixir that satisfies the
  # project's `~> 1.19` requirement (the `group` dep needs `~> 1.19`), rather
  # than the 1.20.0-rc pre-release pinned locally in mise.toml, so CI stays on
  # a published, stable build.
  ELIXIR_VERSION: "1.19.5"
  OTP_VERSION: "28.5"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up BEAM (Erlang/OTP + Elixir)
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Cache dialyzer PLT
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check for compile-time cyclic dependencies
        run: mix xref graph --format cycles --label compile-connected --fail-above 0

      - name: Check for unused dependencies in mix.lock
        run: mix deps.unlock --check-unused

      - name: Check formatting
        run: mix format --check-formatted

      - name: Credo
        run: mix credo --strict

      - name: Test with coverage
        run: mix coveralls

      - name: Create PLT directory
        run: mkdir -p priv/plts

      - name: Dialyzer
        run: mix dialyzer
